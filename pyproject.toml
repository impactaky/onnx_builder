[project]
name = "onnx-builder"
version = "0.3.0"
description = "Utilities for creating and editing ONNX"
authors = [{name="impactaly", email="impactaky@users.noreply.github.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
dependencies = [
    "numpy<2.0",
    "onnx==1.16.1",
    "onnxruntime"
]

[project.optional-dependencies]
dev = [
    "mypy",
    "nptyping",
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-cov",
    "pytest-parallel",
    "ruff",
    "types-protobuf",
]

[project.urls]
Repository = "https://github.com/impactaly/onnx_builder"

[tool.ruff]
exclude = ["test/from_onnx", "test/from_testcase"]

[tool.mypy]
disallow_untyped_calls=true
disallow_untyped_defs=true
warn_redundant_casts=true
warn_unreachable=true
warn_unused_ignores=true
warn_return_any=true
mypy_path=["onnx"]