[project]
name = "onnx-builder"
version = "0.3.0"
description = "Utilities for creating and editing ONNX"
authors = [{name="impactaly", email="impactaky@users.noreply.github.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
dependencies = [
    "numpy",
    "onnx==1.15.0",
    "onnxruntime"
]

[project.optional-dependencies]
dev = [
    "mypy",
    "nptyping",
    "pre-commit",
    "pytest",
    "pytest-parallel",
    "ruff"
]

[project.urls]
Repository = "https://github.com/impactaly/onnx_builder"

[tool.ruff]
exclude = ["test/from_onnx", "test/from_testcase"]

[tool.mypy]
plugins = [
  "numpy.typing.mypy_plugin",
]

warn_redundant_casts=true
warn_unreachable=true
warn_unused_ignores=true
warn_return_any=true
